<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="music-player">
      <div class="image-section">
        <img src="images/image.jpg" alt="" class="cover">
      </div>
      <div class="song-details">
<h2 class="song-title">
  Blinding Lights
</h2>
<p class="artist-name">
  The Weeknd
</p>
      </div>
      <div class="progress-section">
        <span class="current-time">0:00</span>
        <input type="range"
       class="progress-bar"
       value="0"
       min="0"
       max="0">
        <span class="duration">0:00</span>
      </div>
      <div class="controls">
        <button class="control-btn previous"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-btn">
        <i class="fa-solid fa-play"></i>
    </button>

    <button class="control-btn next">
        <i class="fa-solid fa-forward-step"></i>
    </button>
      </div>
      <div class="volume-section">
        <i class="fa-solid fa-volume-high volume-icon"></i>
        <input type="range" class="volume-slider" min="0" max="100" value="100">
      </div>
    </div>
    <audio class="audio"></audio>
  </div>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.4.0/color-thief.min.js"></script>

<script src="js/songs.js"></script>
<script src="js/script.js"></script>
</body>



</html>
